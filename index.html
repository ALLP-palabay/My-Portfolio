<!DOCTYPE html>
 <html lang="en">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Student Portfolio</title>
     <link rel="stylesheet" href="style.css">
 </head>
 <body>
     <header>
         <nav>
             <h1 class="logo">My Portfolio</h1>
             <ul class="nav-links">
                 <li><a href="#home">Home</a></li>
                 <li><a href="#about">About</a></li>
                 <li><a href="#projects">Projects</a></li>
                 <li><a href="#contact">Contact</a></li>
             </ul>
         </nav>
     </header>
     <section id="home" class="hero">
         <div class="hero-content">
             <img src="images/profile.jpg" alt="Profile Photo" class="profile-img">
             <h2 id="student-name">Loading...</h2>
             <p id="student-course">Loading...</p>
             <a href="#projects" class="btn">View My Work</a>
         </div>
     </section>
     <section id="about" class="about">
         <h2>About Me</h2>
         <p id="about-text">Loading...</p>
         <div class="skills">
             <h3>My Skills</h3>
             <div id="skills-list"></div>
         </div>
     </section>
     <section id="projects" class="projects">
         <h2>My Projects</h2>
         <div id="projects-container" class="projects-grid">
             <p>Loading projects...</p>
         </div>
     </section>
     <section id="contact" class="contact">
         <h2>Get In Touch</h2>
         <p id="contact-email">Email: loading...</p>
         <div class="social-links">
             <a href="#" id="fb-link">Facebook</a>
             <a href="#" id="gh-link">GitHub</a>
         </div>
     </section>
     <footer>
         <p>&copy; 2026 My Student Portfolio. All rights reserved.</p>
     </footer>
     <script src="script.js"></script>
 </body>
 </html>
